id = "lgldsilva/costs"
name = "Costs"
version = "1.4.0"
plugin_api = 32
author = "lgldsilva"
license = "MIT"
description = "Gasto do mês e quota dos provedores direto na barra (lê `costs status`)."

# Nível do plugin: vale para o widget e o painel.
[[setting]]
key = "costs_bin"
type = "string"
label_key = "settings.costs_bin.label"
description_key = "settings.costs_bin.description"
default = "costs"

[[widget]]
id = "bar"
entry = "widget.luau"

  [[widget.setting]]
  key = "refresh_minutes"
  type = "int"
  label_key = "settings.refresh_minutes.label"
  description_key = "settings.refresh_minutes.description"
  default = 5
  min = 1
  max = 60

[[panel]]
id = "details"
entry = "panel.luau"
width = 560
height = "fill"
placement = "floating"
open_near_click = true
